name: ci

on:
  push:
    # `master` is the default branch. `main` is listed so a rename does not
    # silently disable CI.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs so a moved tag cannot change what runs.
# The tag each SHA was resolved from is noted in a comment.
jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared support range is >=22.19.0; test the floor and the current LTS.
        node: ["22.19", "24"]
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          # No npm cache anywhere in this repository. It saves a few seconds and
          # makes cache poisoning a way into the release path.
      - run: npm ci
      - run: npm run check
      - run: npm run pack:verify
