name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs so a moved tag cannot change what runs.
# The tag each SHA was resolved from is noted in a comment.
jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared support range is >=22.19.0; test the floor and the current LTS.
        node: ["22.19", "24"]
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          # No npm cache anywhere in this workflow. It saves a few seconds and
          # introduces cache poisoning as a way into the release path.
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check

  release:
    name: publish to npm
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for npm provenance
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.19"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # prepublishOnly runs the full check again inside the publish step.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
